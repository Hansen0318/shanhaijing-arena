<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shanhaijing Arena — M0</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        overflow: hidden;
        background: #253648;
      }

      body {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overscroll-behavior: none;
        touch-action: none;
      }

      #game {
        width: min(100vw, calc(100dvh * 16 / 9));
        aspect-ratio: 16 / 9;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #253648;
      }

      #game canvas {
        display: block;
        width: 100% !important;
        height: auto !important;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 16 / 9;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
