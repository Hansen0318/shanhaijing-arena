<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shanhaijing Arena — M1</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #253648;
      }

      body {
        position: fixed;
        inset: 0;
        overscroll-behavior: none;
        touch-action: none;
      }

      #game {
        position: fixed;
        left: 0;
        top: 0;
        width: 1120px;
        height: 540px;
        overflow: hidden;
        background: #253648;
      }

      #game canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="game" style="visibility:hidden"></div>
    <main id="campaign"></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
