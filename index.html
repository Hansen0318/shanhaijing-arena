<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shanhaijing Arena — M2 Team Select</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #253648;
      }

      body {
        position: fixed;
        inset: 0;
        overscroll-behavior: none;
        touch-action: none;
      }

      #game[hidden] { display:none !important; }
      #game {
        position: fixed;
        left: 0;
        top: 0;
        width: 1120px;
        height: 540px;
        overflow: hidden;
        background: #253648;
      }

      #game canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="game" hidden style="visibility:hidden"></div>
    <main id="campaign"></main>
    <aside id="orientation-gate" hidden aria-live="polite">
      <svg viewBox="0 0 80 80" aria-hidden="true"><rect x="23" y="8" width="34" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="4" transform="rotate(-35 40 36)"/><path d="M17 65c13 10 33 9 46-2" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="m57 58 7 5-2-9" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>ROTATE DEVICE</h1>
      <p>Please rotate your device to landscape.</p>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
