<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shanhaijing Arena — M0</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #253648;
      }

      body {
        position: fixed;
        inset: 0;
        overscroll-behavior: none;
        touch-action: none;
      }

      #game {
        position: fixed;
        left: 0;
        top: 0;
        overflow: hidden;
        background: #253648;
        touch-action: none;
      }

      #game canvas {
        display: block;
        touch-action: none;
      }

      #dom-input-debug {
        position: fixed;
        left: 8px;
        bottom: 8px;
        z-index: 2147483647;
        pointer-events: none;
        white-space: pre;
        font: 12px/1.25 monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.82);
        padding: 6px 8px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="dom-input-debug">Document: idle</div>

    <script>
      (() => {
        const gameHost = document.getElementById('game');

        function syncGameHostToVisualViewport() {
          const vv = window.visualViewport;
          const width = vv ? vv.width : window.innerWidth;
          const height = vv ? vv.height : window.innerHeight;
          const left = vv ? vv.offsetLeft : 0;
          const top = vv ? vv.offsetTop : 0;

          gameHost.style.left = left + 'px';
          gameHost.style.top = top + 'px';
          gameHost.style.width = width + 'px';
          gameHost.style.height = height + 'px';

          window.dispatchEvent(new Event('arena-viewport-sync'));
        }

        function resyncAfterBrowserChromeSettles() {
          syncGameHostToVisualViewport();
          requestAnimationFrame(syncGameHostToVisualViewport);
          setTimeout(syncGameHostToVisualViewport, 80);
          setTimeout(syncGameHostToVisualViewport, 240);
        }

        window.addEventListener('pageshow', resyncAfterBrowserChromeSettles);
        window.addEventListener('resize', resyncAfterBrowserChromeSettles);
        window.addEventListener('orientationchange', resyncAfterBrowserChromeSettles);

        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', syncGameHostToVisualViewport);
          window.visualViewport.addEventListener('scroll', syncGameHostToVisualViewport);
        }

        resyncAfterBrowserChromeSettles();
      })();

      (() => {
        const debug = document.getElementById('dom-input-debug');

        function canvasRectText() {
          const canvas = document.querySelector('#game canvas');
          if (!canvas) return 'canvas: missing';
          const rect = canvas.getBoundingClientRect();
          return 'canvas: ' +
            Math.round(rect.left) + ',' + Math.round(rect.top) + ' ' +
            Math.round(rect.width) + 'x' + Math.round(rect.height);
        }

        function update(label, event, x, y) {
          const target = event.target;
          const targetName = target
            ? target.tagName + (target.id ? '#' + target.id : '')
            : 'none';

          debug.textContent = [
            'Document: ' + label,
            'target: ' + targetName,
            'client: ' + Math.round(x) + ',' + Math.round(y),
            canvasRectText(),
          ].join('\n');
        }

        document.addEventListener('touchstart', (event) => {
          const touch = event.changedTouches && event.changedTouches[0];
          if (!touch) return;
          update('touchstart', event, touch.clientX, touch.clientY);
        }, { capture: true, passive: true });

        document.addEventListener('pointerdown', (event) => {
          update('pointerdown/' + event.pointerType, event, event.clientX, event.clientY);
        }, { capture: true, passive: true });
      })();
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
