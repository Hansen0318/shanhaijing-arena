<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shanhaijing Arena — M0</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #253648;
      }

      body {
        position: fixed;
        inset: 0;
        overscroll-behavior: none;
        touch-action: none;
      }

      #game {
        position: fixed;
        left: 0;
        top: 0;
        width: 1120px;
        height: 540px;
        overflow: hidden;
        background: #253648;
      }

      #game canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <script>
      (() => {
        const STAGE_WIDTH = 1120;
        const STAGE_HEIGHT = 540;
        const game = document.getElementById('game');

        function syncGameHostToVisualViewport() {
          const vv = window.visualViewport;
          const viewportWidth = vv ? vv.width : window.innerWidth;
          const viewportHeight = vv ? vv.height : window.innerHeight;
          const offsetLeft = vv ? vv.offsetLeft : 0;
          const offsetTop = vv ? vv.offsetTop : 0;

          const scale = Math.min(
            viewportWidth / STAGE_WIDTH,
            viewportHeight / STAGE_HEIGHT,
          );

          const width = STAGE_WIDTH * scale;
          const height = STAGE_HEIGHT * scale;
          const left = offsetLeft + (viewportWidth - width) / 2;
          const top = offsetTop + (viewportHeight - height) / 2;

          game.style.width = `${width}px`;
          game.style.height = `${height}px`;
          game.style.left = `${left}px`;
          game.style.top = `${top}px`;
        }

        function resyncAfterSafariSettles() {
          syncGameHostToVisualViewport();
          requestAnimationFrame(syncGameHostToVisualViewport);
          setTimeout(syncGameHostToVisualViewport, 80);
          setTimeout(syncGameHostToVisualViewport, 240);
        }

        window.addEventListener('pageshow', resyncAfterSafariSettles);
        window.addEventListener('resize', resyncAfterSafariSettles);
        window.addEventListener('orientationchange', resyncAfterSafariSettles);

        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', syncGameHostToVisualViewport);
          window.visualViewport.addEventListener('scroll', syncGameHostToVisualViewport);
        }

        resyncAfterSafariSettles();
      })();
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
