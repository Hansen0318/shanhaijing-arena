name: M0 Pages Preview

on:
  push:
    branches:
      - feat/m0-combat-core-20260927
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        if: "!contains(github.event.head_commit.message, '[botuo basic release]')"
        run: npm test
      - name: Test bounded P2 Basic release surface
        if: contains(github.event.head_commit.message, '[botuo basic release]')
        env:
          BOTUO_BODY_SCALE: ${{ contains(github.event.head_commit.message, '[botuo body scale]') }}
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const report=JSON.parse(readFileSync('docs/verification/M5C_P2_BOTUO_BASIC_RUNTIME.json'));
          const bounded='node --test tests/botuoBasicRuntime.test.js tests/botuoBasicPacking.test.js tests/assetPresenter.test.js tests/actionPlayback.test.js tests/botuoIdleRuntime.test.js tests/botuoMove.test.js';
          const [command,...args]=(process.env.BOTUO_BODY_SCALE==='true'?bounded:report.tests.command).split(/\s+/);
          if(command!=='node'||args[0]!=='--test')throw Error('Unexpected release test command');
          execFileSync(process.execPath,args,{stdio:'inherit'});
          JS

      - name: Build
        run: npm run build

      - name: Check approved Awakening in real Chromium
        if: contains(github.event.head_commit.message, '[awakening browser]')
        env:
          ARENA_BROWSER_TOOL_ROOT: ${{ runner.temp }}/arena-browser-tool
          ARENA_BROWSER_OUTPUT: ${{ runner.temp }}/awakening-browser
        run: |
          npm install --prefix "$ARENA_BROWSER_TOOL_ROOT" --no-save --package-lock=false playwright@1.62.1
          node "$ARENA_BROWSER_TOOL_ROOT/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
          node scripts/checkLushuAwakeningBrowser.mjs
      - name: Preserve Awakening browser evidence
        if: always() && contains(github.event.head_commit.message, '[awakening browser]')
        uses: actions/upload-artifact@v4
        with:
          name: awakening-browser-verification
          path: ${{ runner.temp }}/awakening-browser
          if-no-files-found: warn
      - name: Check approved P2 Basic in real Chromium
        if: contains(github.event.head_commit.message, '[botuo basic release]')
        env:
          ARENA_BROWSER_TOOL_ROOT: ${{ runner.temp }}/arena-browser-tool
          ARENA_BROWSER_OUTPUT: ${{ runner.temp }}/botuo-basic-browser
        run: |
          npm install --prefix "$ARENA_BROWSER_TOOL_ROOT" --no-save --package-lock=false playwright@1.62.1
          node "$ARENA_BROWSER_TOOL_ROOT/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
          node scripts/checkBotuoBasicBrowser.mjs
      - name: Preserve P2 Basic browser evidence
        if: always() && contains(github.event.head_commit.message, '[botuo basic release]')
        uses: actions/upload-artifact@v4
        with:
          name: botuo-basic-browser-verification
          path: ${{ runner.temp }}/botuo-basic-browser
          if-no-files-found: warn
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
