name: M0 Pages Preview

on:
  push:
    branches:
      - feat/m0-combat-core-20260927
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        if: "!contains(github.event.head_commit.message, '[botuo special probe]') && !contains(github.event.head_commit.message, '[botuo special release]') && !contains(github.event.head_commit.message, '[botuo heavy') && !contains(github.event.head_commit.message, '[botuo basic release]') && !contains(github.event.head_commit.message, '[viewport probe]') && !contains(github.event.head_commit.message, '[viewport release]')"
        run: npm test
      - name: Test bounded viewport surface
        if: contains(github.event.head_commit.message, '[viewport probe]') || contains(github.event.head_commit.message, '[viewport release]')
        run: node --test tests/viewportSync.test.js tests/landingView.test.js tests/routeOwnership.test.js tests/campaignNavigation.test.js tests/appRouteReset.test.js tests/lazyBattleRuntime.test.js
      - name: Test bounded P2 Basic release surface
        if: contains(github.event.head_commit.message, '[botuo basic release]')
        env:
          BOTUO_BODY_SCALE: ${{ contains(github.event.head_commit.message, '[botuo body scale]') }}
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const report=JSON.parse(readFileSync('docs/verification/M5C_P2_BOTUO_BASIC_RUNTIME.json'));
          const bounded='node --test tests/botuoStaticScale.test.js tests/botuoBasicRuntime.test.js tests/botuoBasicPacking.test.js tests/assetPresenter.test.js tests/actionPlayback.test.js tests/botuoIdleRuntime.test.js tests/botuoMove.test.js tests/assetGuard.test.js tests/awakeningRuntimePacking.test.js tests/basicActionIntegration.test.js tests/dynamicAssetIntegration.test.js tests/lushuHeavyAssets.test.js tests/lushuSpecialAssets.test.js tests/xingxingKo.test.js';
          const [command,...args]=(process.env.BOTUO_BODY_SCALE==='true'?bounded:report.tests.command).split(/\s+/);
          if(command!=='node'||args[0]!=='--test')throw Error('Unexpected release test command');
          execFileSync(process.execPath,args,{stdio:'inherit'});
          JS

      - name: Test bounded P2 Heavy shared presentation and lossless packing
        if: contains(github.event.head_commit.message, '[botuo heavy')
        run: node --test tests/botuoHeavyLifecycle.test.js tests/botuoHeavyRuntime.test.js tests/botuoHeavyPacking.test.js tests/frameTrim.test.js tests/actionPlayback.test.js tests/assetPresenter.test.js tests/assetResidency.test.js tests/dynamicAssetIntegration.test.js tests/assetGuard.test.js tests/botuoBasicRuntime.test.js tests/botuoBasicPacking.test.js tests/botuoStaticScale.test.js tests/botuoMove.test.js tests/xingxingMove.test.js tests/jiuweihuMove.test.js tests/chiruMove.test.js

      - name: Build
        run: npm run build

      - name: Test bounded P2 Special shared runtime
        if: contains(github.event.head_commit.message, '[botuo special probe]') || contains(github.event.head_commit.message, '[botuo special release]')
        run: node --test tests/botuoSpecialLifecycle.test.js tests/botuoSpecialRuntime.test.js tests/botuoSpecialPacking.test.js tests/botuoSpecialProbe.test.js tests/botuoHeavyLifecycle.test.js tests/botuoHeavyRuntime.test.js tests/botuoHeavyPacking.test.js tests/frameTrim.test.js tests/actionPlayback.test.js tests/assetPresenter.test.js tests/assetResidency.test.js tests/dynamicAssetIntegration.test.js tests/assetGuard.test.js tests/botuoBasicRuntime.test.js tests/botuoBasicPacking.test.js tests/botuoStaticScale.test.js tests/botuoMove.test.js tests/xingxingMove.test.js tests/jiuweihuMove.test.js tests/chiruMove.test.js
      - name: Verify authorized Special release reuses exact Browser-tested sources
        if: contains(github.event.head_commit.message, '[botuo special release]')
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,readdirSync,mkdirSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const root='docs/verification/P2_SPECIAL_RUNTIME/',gate=JSON.parse(readFileSync(root+'browser-gate.json')),authorization=JSON.parse(readFileSync(root+'release-authorization.json'));
          assert.equal(authorization.playerStatement,'授權部署');assert.equal(authorization.testedCommit,gate.testedCommit);assert.equal(authorization.scope,'P2 Special Pages deployment and public verification only');assert.equal(gate.gates.browser,'PASS');
          for(const [name,sha] of Object.entries(gate.fileSha256))assert.equal(createHash('sha256').update(readFileSync(root+name)).digest('hex'),sha,name);
          execFileSync('git',['fetch','--no-tags','--depth=1','origin',gate.testedCommit],{stdio:'inherit'});
          const runtimePaths=['src','public','scripts','tests','index.html','package.json','package-lock.json','vite.config.js'];
          execFileSync('git',['diff','--exit-code',gate.testedCommit,'HEAD','--',...runtimePaths],{stdio:'inherit'});
          const walk=dir=>readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(dir+'/'+e.name):[{path:(dir+'/'+e.name).slice(5),bytes:readFileSync(dir+'/'+e.name).length,sha256:createHash('sha256').update(readFileSync(dir+'/'+e.name)).digest('hex')}]);
          const output='.git/p2-special-release';mkdirSync(output,{recursive:true});
          writeFileSync(output+'/build-inventory.json',JSON.stringify({testedCommit:gate.testedCommit,releaseCommit:process.env.GITHUB_SHA,browserRun:gate.workflow.run,runtimePaths,sourceEquality:'PASS',files:walk('dist')},null,2)+'\n');
          console.log('Authorized release: exact Browser-tested runtime source, receipt/report hashes and build inventory PASS');
          JS
      - name: Preserve Special release source proof and build inventory
        if: contains(github.event.head_commit.message, '[botuo special release]')
        uses: actions/upload-artifact@v4
        with:
          name: botuo-special-release-source-proof
          path: .git/p2-special-release
          include-hidden-files: true
          if-no-files-found: error
      - name: Probe P2 Special native Phaser and built entry without Pages
        if: contains(github.event.head_commit.message, '[botuo special probe]')
        env:
          ARENA_BROWSER_TOOL_ROOT: ${{ runner.temp }}/arena-browser-tool
          ARENA_BROWSER_OUTPUT: ${{ runner.temp }}/botuo-special-browser
        run: |
          npm install --prefix "$ARENA_BROWSER_TOOL_ROOT" --no-save --package-lock=false playwright@1.62.1
          node "$ARENA_BROWSER_TOOL_ROOT/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
          status=0
          node scripts/checkBotuoSpecialBrowser.mjs || status=1
          node scripts/checkBotuoSpecialBuiltEntry.mjs || status=1
          exit "$status"
      - name: Preserve P2 Special probe evidence
        if: always() && contains(github.event.head_commit.message, '[botuo special probe]')
        uses: actions/upload-artifact@v4
        with:
          name: botuo-special-browser-verification
          path: ${{ runner.temp }}/botuo-special-browser
          if-no-files-found: warn

      - name: Check approved Awakening in real Chromium
        if: contains(github.event.head_commit.message, '[awakening browser]')
        env:
          ARENA_BROWSER_TOOL_ROOT: ${{ runner.temp }}/arena-browser-tool
          ARENA_BROWSER_OUTPUT: ${{ runner.temp }}/awakening-browser
        run: |
          npm install --prefix "$ARENA_BROWSER_TOOL_ROOT" --no-save --package-lock=false playwright@1.62.1
          node "$ARENA_BROWSER_TOOL_ROOT/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
          node scripts/checkLushuAwakeningBrowser.mjs
      - name: Preserve Awakening browser evidence
        if: always() && contains(github.event.head_commit.message, '[awakening browser]')
        uses: actions/upload-artifact@v4
        with:
          name: awakening-browser-verification
          path: ${{ runner.temp }}/awakening-browser
          if-no-files-found: warn
      - name: Check approved P2 Basic in real Chromium
        if: contains(github.event.head_commit.message, '[botuo basic release]')
        env:
          ARENA_BROWSER_TOOL_ROOT: ${{ runner.temp }}/arena-browser-tool
          ARENA_BROWSER_OUTPUT: ${{ runner.temp }}/botuo-basic-browser
        run: |
          npm install --prefix "$ARENA_BROWSER_TOOL_ROOT" --no-save --package-lock=false playwright@1.62.1
          node "$ARENA_BROWSER_TOOL_ROOT/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
          node scripts/checkBotuoBasicBrowser.mjs
      - name: Preserve P2 Basic browser evidence
        if: always() && contains(github.event.head_commit.message, '[botuo basic release]')
        uses: actions/upload-artifact@v4
        with:
          name: botuo-basic-browser-verification
          path: ${{ runner.temp }}/botuo-basic-browser
          if-no-files-found: warn
      - name: Check mobile viewport in Chromium and WebKit
        if: contains(github.event.head_commit.message, '[viewport probe]') || contains(github.event.head_commit.message, '[viewport release]')
        env:
          ARENA_BROWSER_TOOL_ROOT: ${{ runner.temp }}/arena-browser-tool
          ARENA_BROWSER_OUTPUT: ${{ runner.temp }}/mobile-viewport
          VIEWPORT_PROBE: ${{ contains(github.event.head_commit.message, '[viewport probe]') }}
          ACTOR_SCALE_RELEASE: ${{ contains(github.event.head_commit.message, '[move body release]') }}
        run: |
          npm install --prefix "$ARENA_BROWSER_TOOL_ROOT" --no-save --package-lock=false playwright@1.62.1
          node "$ARENA_BROWSER_TOOL_ROOT/node_modules/playwright/cli.js" install --with-deps chromium webkit --only-shell
          node scripts/checkMobileViewport.mjs
      - name: Preserve mobile viewport evidence
        if: always() && (contains(github.event.head_commit.message, '[viewport probe]') || contains(github.event.head_commit.message, '[viewport release]'))
        uses: actions/upload-artifact@v4
        with:
          name: mobile-viewport-verification
          path: ${{ runner.temp }}/mobile-viewport
          if-no-files-found: warn
      - name: Check P2 Heavy and lossless trim in real Chromium and built entry
        if: contains(github.event.head_commit.message, '[botuo heavy')
        env:
          ARENA_BROWSER_TOOL_ROOT: ${{ runner.temp }}/arena-browser-tool
          ARENA_BROWSER_OUTPUT: ${{ runner.temp }}/botuo-heavy-browser
        run: |
          npm install --prefix "$ARENA_BROWSER_TOOL_ROOT" --no-save --package-lock=false playwright@1.62.1
          node "$ARENA_BROWSER_TOOL_ROOT/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
          status=0
          node scripts/checkBotuoHeavyBrowser.mjs || status=1
          node scripts/checkBotuoHeavyBuiltEntry.mjs || status=1
          exit "$status"
      - name: Preserve P2 Heavy browser evidence
        if: always() && contains(github.event.head_commit.message, '[botuo heavy')
        uses: actions/upload-artifact@v4
        with:
          name: botuo-heavy-browser-verification
          path: ${{ runner.temp }}/botuo-heavy-browser
          if-no-files-found: warn
      - name: Configure Pages
        if: "!contains(github.event.head_commit.message, '[botuo special probe]') && !contains(github.event.head_commit.message, '[viewport probe]') && !contains(github.event.head_commit.message, '[botuo heavy probe]')"
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: "!contains(github.event.head_commit.message, '[botuo special probe]') && !contains(github.event.head_commit.message, '[viewport probe]') && !contains(github.event.head_commit.message, '[botuo heavy probe]')"
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: "!contains(github.event.head_commit.message, '[botuo special probe]') && !contains(github.event.head_commit.message, '[viewport probe]') && !contains(github.event.head_commit.message, '[botuo heavy probe]')"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
