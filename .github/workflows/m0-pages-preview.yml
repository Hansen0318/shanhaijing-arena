name: M0 Pages Preview

on:
  push:
    branches:
      - feat/m0-combat-core-20260927
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check approved Awakening in real Chromium
        if: contains(github.event.head_commit.message, '[awakening browser]')
        env:
          ARENA_BROWSER_TOOL_ROOT: ${{ runner.temp }}/arena-browser-tool
          ARENA_BROWSER_OUTPUT: ${{ runner.temp }}/awakening-browser
        run: |
          npm install --prefix "$ARENA_BROWSER_TOOL_ROOT" --no-save --package-lock=false playwright@1.62.1
          node "$ARENA_BROWSER_TOOL_ROOT/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
          node scripts/checkLushuAwakeningBrowser.mjs
      - name: Preserve Awakening browser evidence
        if: always() && contains(github.event.head_commit.message, '[awakening browser]')
        uses: actions/upload-artifact@v4
        with:
          name: awakening-browser-verification
          path: ${{ runner.temp }}/awakening-browser
          if-no-files-found: warn
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
