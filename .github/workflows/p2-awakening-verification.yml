name: P2 Awakening Native Verification
on:
  push:
    branches: [feat/m0-combat-core-20260927]
    paths:
      - 'src/**'
      - 'public/assets/botuo-awakening-runtime-v1/**'
      - 'scripts/checkBotuoAwakeningBrowser.mjs'
      - '.github/workflows/p2-awakening-verification.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Affected event and rendering checks
        run: node --test tests/botuoAwakeningLifecycle.test.js tests/botuoAwakeningRuntime.test.js tests/assetCache.test.js tests/assetResidency.test.js tests/dynamicAssetIntegration.test.js tests/assetGuard.test.js tests/botuoBasicRuntime.test.js tests/botuoSpecialRuntime.test.js tests/basicActionIntegration.test.js
      - run: npm run build
      - name: Native WebGL and actual built mobile entry
        env:
          ARENA_BROWSER_TOOL_ROOT: ${{ runner.temp }}/awakening-browser-tool
          ARENA_BROWSER_OUTPUT: ${{ runner.temp }}/awakening-browser-evidence
        run: |
          npm install --prefix "$ARENA_BROWSER_TOOL_ROOT" --no-save --package-lock=false playwright@1.62.1
          node "$ARENA_BROWSER_TOOL_ROOT/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
          status=0
          node scripts/checkBotuoAwakeningBrowser.mjs || status=1
          node scripts/checkBotuoAwakeningBrowser.mjs --built || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-awakening-browser-evidence
          path: ${{ runner.temp }}/awakening-browser-evidence
          if-no-files-found: warn
# Verification only: no Pages upload/deploy, no replacement of the normal full-suite workflow.
